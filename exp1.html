<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#fff;font:bold 21px/1.35 monospace;color:#000;margin:6px}
</style></head><body><pre id=o>boot</pre>
<script>window.MODULES=["./x4947_p1_m0.mjs","./x4947_p1_m1.mjs","./x4947_p1_m2.mjs","./x4947_p1_m3.mjs","./x4947_p1_m4.mjs","./x4947_p1_m5.mjs","./x4947_p1_m6.mjs","./x4947_p1_m7.mjs","./x4947_p1_m8.mjs","./x4947_p1_m9.mjs"];</script>
<script type="module">
const L=["S0-start"];
const out=document.getElementById('o');
function R(){out.textContent=L.join("\n")}
const ab=new ArrayBuffer(8),f64=new Float64Array(ab),buf=new Uint32Array(ab);
function c2f(lo,hi){buf[0]=lo;buf[1]=hi;return f64[0]}
function flw(v){f64[0]=v;return buf[0]>>>0}
async function attempt(m,i){
  try{
    m.p0;
    const ca=[1,2]; ca.pop(); ca.pop();
    const da=[2.30234E-320,2.30234E-320];
    const fm=c2f(0x00000000,0x000000B2);
    function opt(){try{m.p0=fm}catch(e){return false}return true}
    let thrown=0;
    for(let k=0;k<40000;k++){if(!opt())thrown++}
    opt();
    new WeakRef(m);
    if(ca.length>1000){
      L.push("S2-LEN@"+i+"="+ca.length);R();
      function addrOf(o){ca[4]=o;return (flw(da[0])>>>1)}
      function fakeObj(a){da[0]=c2f((a|1)>>>0,0);return ca[4]}
      const probe={mark:13.37};
      const ad=addrOf(probe);
      L.push("S3-ADDR@"+i+"=0x"+ad.toString(16));R();
      try{
        const back=fakeObj(ad);
        const okv=(back&&back.mark===13.37);
        L.push("S4-VERIFY@"+i+"="+(okv?"***PRIMITIVES-OK***":("partial:"+back)));R();
        return okv;
      }catch(e){L.push("S4-ERR@"+i+" "+e);R()}
    } else {
      L.push("T@"+i+":len="+ca.length+" thrown="+thrown);R();
    }
  }catch(e){L.push("E@"+i+" "+(e&&e.message));R()}
  return false;
}
for(let i=0;i<window.MODULES.length;i++){
  const m=await import(window.MODULES[i]);
  if(await attempt(m,i))break;
  if(i%3===2){L.push("..."+(i+1)+"/"+window.MODULES.length);R()}
}
R();
const t0=Date.now();while(Date.now()-t0<4500);
</script>
</body></html>
