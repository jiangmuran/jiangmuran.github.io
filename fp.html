<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#fff;font:bold 26px/1.4 monospace;color:#000;margin:10px}
</style></head><body><pre id=o>boot</pre><script>
var ua = navigator.userAgent;
var lines = [
 "UA: " + ua,
 "PLAT: " + navigator.platform,
 "HW: " + navigator.hardwareConcurrency,
 "LANG: " + navigator.language,
 "TZ: " + Intl.DateTimeFormat().resolvedOptions().timeZone,
 "RES: " + screen.width + "x" + screen.height,
];
// 特性检测粗判版本
var feats = [];
feats.push("RAF-FS:" + ("requestAnimationFrame" in window));
feats.push("EYE:" + ("EyeDropper" in window));
feats.push("VIEWTRANS:" + (!!document.startViewTransition));
feats.push("PDF:" + ("PDFViewer" in window || false));
feats.push("WEBGPU:" + (!!navigator.gpu));
feats.push("SPECS:" + (!!window.speechSynthesis));
feats.push("FSACCESS:" + (("showOpenFilePicker" in window)));
feats.push("BFCACHE:" + (("pageswap" in window)));
lines.push(feats.join(" "));
lines.push("HREF: " + location.href.slice(0,80));
document.getElementById('o').textContent = lines.join("\n");
</script></body></html>
