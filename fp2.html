<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#fff;font:bold 30px/1.3 monospace;color:#000;margin:10px}
</style></head><body><pre id=o></pre><script>
var ua = navigator.userAgent;
var v = (ua.split("Chrome/")[1]||"?").split(" ")[0];
var lines = ["CHROME-VER: " + v, "UA-TAIL: " + ua.slice(-40)];
document.getElementById('o').textContent = lines.join("\n");
</script></body></html>
